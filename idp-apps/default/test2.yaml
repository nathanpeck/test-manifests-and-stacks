apiVersion: apps/v1
kind: Deployment
metadata:
  name: test2
  namespace: default
  labels:
    app: test2
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: idp-apps/default/test2.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: 2,5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test2
  template:
    metadata:
      labels:
        app: test2
        managed-by: portainer-idp
    spec:
      containers:
        - name: test2
          image: nginx
          imagePullPolicy: Always
