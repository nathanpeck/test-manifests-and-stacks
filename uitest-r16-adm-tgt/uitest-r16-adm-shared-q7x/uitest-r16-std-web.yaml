apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r16-std-web
  namespace: uitest-r16-adm-shared-q7x
  labels:
    app: uitest-r16-std-web
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r16-adm-tgt/uitest-r16-adm-shared-q7x/uitest-r16-std-web.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '58'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r16-std-web
  template:
    metadata:
      labels:
        app: uitest-r16-std-web
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27.3-alpine
          imagePullPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uitest-r16-std-web
  namespace: uitest-r16-adm-shared-q7x
spec:
  tls:
    - hosts: [uitest-r16-std.invalid]
      secretName: uitest-r16-std-sec
  rules:
    - host: uitest-r16-std.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: uitest-r16-std-web, port: {number: 80}}}
