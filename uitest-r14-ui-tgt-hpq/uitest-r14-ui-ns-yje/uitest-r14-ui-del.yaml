apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r14-ui-del
  namespace: uitest-r14-ui-ns-yje
  labels:
    app: uitest-r14-ui-del
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r14-ui-tgt-hpq/uitest-r14-ui-ns-yje/uitest-r14-ui-del.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '50'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r14-ui-del
  template:
    metadata:
      labels:
        app: uitest-r14-ui-del
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r14-ui-del
  namespace: uitest-r14-ui-ns-yje
  labels:
    app: uitest-r14-ui-del
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r14-ui-del
  type: ClusterIP
  ports:
    - name: port-80
      port: 80
      targetPort: 80
      protocol: TCP
