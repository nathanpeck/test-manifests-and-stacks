apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r14-ui-bld
  namespace: uitest-r14-ui-ns-zmw
  labels:
    app: uitest-r14-ui-bld
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r14-ui-tgt-hpq/uitest-r14-ui-ns-zmw/uitest-r14-ui-bld.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '50'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r14-ui-bld
  template:
    metadata:
      labels:
        app: uitest-r14-ui-bld
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
