apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r13-scale-a13
  namespace: uitest-r13-scale-kzj
  labels:
    app: uitest-r13-scale-a13
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: 'main'
    portainer-idp/git-path: 'uitest-r13-scale-tgt/uitest-r13-scale-kzj/uitest-r13-scale-a13.yaml'
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '48'
spec:
  replicas: 0
  selector:
    matchLabels:
      app: uitest-r13-scale-a13
  template:
    metadata:
      labels:
        app: uitest-r13-scale-a13
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          env:
            - name: SCALE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: uitest-r13-scale-sec
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
