apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migrate-src-data
  namespace: migrate-test2
  labels:
    app: migrate-src
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: fbdb6034-ff86-4cd5-ad67-27bb58a2fb0d
    portainer-run/git-branch: main
    portainer-run/git-path: local/migrate-test2/migrate-src.yaml
    portainer-run/vibe-source-path: local/migrate-test2/migrate-src/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migrate-src
  namespace: migrate-test2
  labels:
    app: migrate-src
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: fbdb6034-ff86-4cd5-ad67-27bb58a2fb0d
    portainer-run/git-branch: main
    portainer-run/git-path: local/migrate-test2/migrate-src.yaml
    portainer-run/vibe-source-path: local/migrate-test2/migrate-src/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: migrate-src
  template:
    metadata:
      labels:
        app: migrate-src
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/nathanpeck/test-manifests-and-stacks /tmp/repo && mkdir -p
              /usr/share/nginx/html && cp -r /tmp/repo/local/migrate-test2/migrate-src/src/. /usr/share/nginx/html/ &&
              rm -rf /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: migrate-src-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: migrate-src-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: migrate-src
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: migrate-src-data
