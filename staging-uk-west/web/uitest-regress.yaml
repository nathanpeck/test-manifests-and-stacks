apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-regress
  namespace: web
  labels:
    app: uitest-regress
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '2'
    portainer-idp/git-branch: main
    portainer-idp/git-path: staging-uk-west/web/uitest-regress.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-stack-id: '38'
    portainer-idp/edge-group-ids: '7'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-regress
  template:
    metadata:
      labels:
        app: uitest-regress
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:alpine
          imagePullPolicy: Always
