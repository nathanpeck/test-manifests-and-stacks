apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-wordpress-data
  namespace: uitest-cat
  labels:
    app: uitest-cat-wordpress-mysql
    managed-by: portainer-idp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-mysql-data
  namespace: uitest-cat
  labels:
    app: uitest-cat-wordpress-mysql
    managed-by: portainer-idp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-cat-wordpress-mysql
  namespace: uitest-cat
  labels:
    app: uitest-cat-wordpress-mysql
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '2'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-cat-sweep-0928/uitest-cat/uitest-cat-wordpress-mysql.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-stack-id: '66'
    portainer-idp/edge-group-ids: '24'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-cat-wordpress-mysql
  template:
    metadata:
      labels:
        app: uitest-cat-wordpress-mysql
        managed-by: portainer-idp
    spec:
      containers:
        - name: wordpress
          image: wordpress:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: WORDPRESS_DB_HOST
              value: 127.0.0.1:3306
            - name: WORDPRESS_DB_USER
              value: wpuser
            - name: WORDPRESS_DB_PASSWORD
              value: changeme
            - name: WORDPRESS_DB_NAME
              value: wordpress
          volumeMounts:
            - name: wordpress-wordpress-data
              mountPath: /var/www/html
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: wpuser
            - name: MYSQL_PASSWORD
              value: changeme
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: '1'
          volumeMounts:
            - name: wordpress-mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: wordpress-wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-wordpress-data
        - name: wordpress-mysql-data
          persistentVolumeClaim:
            claimName: wordpress-mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-cat-wordpress-mysql
  namespace: uitest-cat
  labels:
    app: uitest-cat-wordpress-mysql
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-cat-wordpress-mysql
  type: NodePort
  ports:
    - name: port-80
      port: 80
      targetPort: 80
      protocol: TCP
