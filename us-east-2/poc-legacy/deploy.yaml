apiVersion: v1
kind: Namespace
metadata:
  name: poc-adopt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-config
  namespace: poc-adopt
data:
  mode: hand-made
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: poc-adopt
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy}
  template:
    metadata:
      labels: {app: legacy}
    spec:
      containers:
        - name: legacy
          image: registry.k8s.io/pause:3.10
