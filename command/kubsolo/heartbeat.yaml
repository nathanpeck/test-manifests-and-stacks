apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
  namespace: default
  labels:
    app: heartbeat
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: heartbeat
        spec:
          restartPolicy: Never
          containers:
            - name: heartbeat
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - 'echo "heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"'
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
