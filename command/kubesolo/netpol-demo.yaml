# A namespace for demonstrating a default-deny network policy pattern.
#
# Empty on purpose: it deploys nothing on its own. The policy that gives it its
# name is adopted separately, so that what is being reviewed here is the
# namespace and its admission posture, and nothing else.
#
# Restricted from the start, matching the smoke-test namespace beside it. A
# namespace is cheapest to lock down while nothing is running in it.
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
