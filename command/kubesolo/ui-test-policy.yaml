# What PSA does not cover, for the ui-test namespace.
#
# The namespace already enforces the restricted Pod Security Standard, which
# handles privilege, capabilities, host access and runAsNonRoot. These are the
# two rules that standard has nothing to say about and that this cluster
# actually needs:
#
#   - Resources must be bounded. One node, so an unbounded pod is the whole
#     node. A LimitRange would supply defaults instead, which hides the
#     omission rather than refusing it.
#   - Image tags must be immutable. What gets pulled after a restart should be
#     what was reviewed, and ":latest" is a promise that it will not be.
#
# Namespaced Policy, not ClusterPolicy: it applies to ui-test and nowhere else.
# Enforce is safe here because the namespace is empty and exists for testing.
# On a namespace with workloads, start at Audit and move to Enforce once the
# policy reports come back clean.
#
# Written for Kyverno v1.18.2 (chart 3.8.2): failureAction belongs to each
# rule, as the spec-level validationFailureAction is deprecated in that version.
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: ui-test-baseline
  namespace: ui-test
  annotations:
    policies.kyverno.io/title: ui-test baseline
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires bounded resources and immutable image tags for pods in the
      ui-test namespace, covering what Pod Security Admission does not.
spec:
  rules:
    - name: require-resource-bounds
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          Every container must set CPU and memory requests and limits. This is a
          single-node cluster, so a pod without them can take the whole node.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          Every image must carry an explicit tag. An untagged image resolves to
          latest, which is not a version anybody reviewed.
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          Images must not use the latest tag: what it points at can change under
          a restart, so what runs stops being what was approved.
        pattern:
          spec:
            containers:
              - image: "!*:latest"
