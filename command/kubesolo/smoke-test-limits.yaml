# The deployment sets its own requests and limits, but nothing stops a future
# manifest in this namespace from omitting them. This is a single Raspberry Pi
# node, so one unbounded pod is the whole node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: smoke-test
  namespace: smoke-test
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 512Mi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: smoke-test
  namespace: smoke-test
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: "500m"
        memory: 256Mi
