# An empty namespace, used to exercise the approvals path end to end.
#
# It deploys nothing on its own. That is the point: it makes the mechanism —
# commit, merge, stack registration, reconciliation — the only thing under
# test, and makes undoing it a single file removal.
#
# Restricted from the start. A namespace is cheapest to lock down while nothing
# is running in it, and enforcing it later means finding out which workloads it
# breaks.
apiVersion: v1
kind: Namespace
metadata:
  name: ui-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
