## Sealed Secrets controller values
## Deployed into 'default' namespace (the only proposable namespace on this environment).
## The controller manages SealedSecret resources cluster-wide regardless of which
## namespace it runs in.

## Use a fixed release name so kubeseal --controller-name and --controller-namespace
## can reference it deterministically.
fullnameOverride: "sealed-secrets"

## The controller needs a ClusterRole to watch SealedSecret resources across all
## namespaces and to write the resulting Secrets. Leave rbac.create true (default).
rbac:
  create: true
  clusterRole: true

## Dedicated ServiceAccount so the controller's identity is clear in audit logs.
serviceAccount:
  create: true
  name: "sealed-secrets"

## Resource bounds — the controller is lightweight.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

## Security hardening
containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

podSecurityContext:
  enabled: true
  runAsNonRoot: true

## Don't mount the default SA token; the controller uses its own SA above.
automountServiceAccountToken: true
