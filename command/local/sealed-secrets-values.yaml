## Sealed Secrets controller values
## Deployed into kube-system — the conventional namespace for this controller.
## The controller manages SealedSecret resources cluster-wide regardless of
## which namespace it runs in.

## Fixed release name so kubeseal --controller-name and --controller-namespace
## can reference it deterministically.
fullnameOverride: "sealed-secrets"

## ClusterRole required to watch SealedSecret resources across all namespaces
## and to write the resulting Secrets.
rbac:
  create: true
  clusterRole: true

## Dedicated ServiceAccount so the controller's identity is clear in audit logs.
serviceAccount:
  create: true
  name: "sealed-secrets"

## Resource bounds — the controller is lightweight.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

## Security hardening
containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

podSecurityContext:
  enabled: true
  runAsNonRoot: true
