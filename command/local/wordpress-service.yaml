# ClusterIP entrypoint for WordPress. Traffic reaches the pod via the
# Traefik IngressRoute defined in wordpress-ingressroute.yaml rather than
# a cloud load balancer.
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: default
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
