# Internal Service for WordPress. ClusterIP is sufficient because Traefik
# handles external access via the Ingress below. The LoadBalancer type is
# not needed and was stuck in <pending> on this cluster anyway.
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: default
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
