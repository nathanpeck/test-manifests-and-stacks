# Persistent storage for Ghost content (themes, images, etc.).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-content
  namespace: default
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: frontend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
