# Traefik ingress for Ghost, matching the pattern used by cozy and network.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost
  namespace: default
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: frontend
spec:
  ingressClassName: traefik
  rules:
    - host: ghost.nathanpeck.gg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghost
                port:
                  name: http
