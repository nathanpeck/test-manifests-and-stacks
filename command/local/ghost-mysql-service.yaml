# Headless ClusterIP service so Ghost can reach its database by name.
apiVersion: v1
kind: Service
metadata:
  name: ghost-mysql
  namespace: default
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
