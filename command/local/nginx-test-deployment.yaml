# A test fixture for exercising multi-file review and stack reconciliation.
# Paired with nginx-test-service.yaml. Safe to remove.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: kube-public
  labels:
    app.kubernetes.io/name: nginx-test
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: test-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-test
        app.kubernetes.io/managed-by: portainer-command
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
