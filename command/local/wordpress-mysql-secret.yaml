# Credentials shared by the MySQL and WordPress Deployments.
#
# WARNING: these values are plaintext in Git. There is no sealed-secrets or
# external secret store configured for this environment, so this is the only
# way the repository can carry them today. Rotate by editing this file and
# recreating the MySQL data volume, since MySQL only reads the root password
# on first initialisation.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-mysql
  namespace: default
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  mysql-root-password: 6KtyHtqjrMM2rrAiuDf1YVqK
  mysql-database: wordpress
  mysql-user: wordpress
  mysql-password: Zr1Jrpa6a3n0SWJMMOthr3CD
