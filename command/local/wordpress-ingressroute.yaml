# Traefik IngressRoute for WordPress. Routes all HTTP traffic on the web
# entrypoint (port 80) to the wordpress ClusterIP Service.
#
# Replace the Host() rule with the hostname Traefik should match, e.g.:
#   rule: Host(`wordpress.example.com`)
# Or remove the Host() rule entirely to catch all unmatched traffic:
#   rule: PathPrefix(`/`)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wordpress
  namespace: default
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: frontend
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: wordpress
          port: 80
