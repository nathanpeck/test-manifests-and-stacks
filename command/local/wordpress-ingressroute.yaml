# Traefik IngressRoute for WordPress. Routes HTTP traffic on the web
# entrypoint (port 80) for hostname wordpress.nathanpeck.gg to the
# wordpress ClusterIP Service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wordpress
  namespace: default
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: frontend
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`wordpress.nathanpeck.gg`)
      kind: Rule
      services:
        - name: wordpress
          port: 80
