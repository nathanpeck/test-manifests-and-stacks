# Data directory for the MySQL Deployment.
#
# storageClassName is omitted on purpose: the cluster's only StorageClass,
# local-path, is marked default. It is node-local and WaitForFirstConsumer,
# so this volume binds when the MySQL pod is first scheduled and pins the
# workload to that node from then on.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-mysql-data
  namespace: default
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
