# ClusterIP service for Ghost — traffic enters via the Traefik ingress.
apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: default
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/managed-by: portainer-command
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
