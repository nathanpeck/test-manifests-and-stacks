apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: test
  labels:
    app: redis
    managed-by: portainer-idp
    app.kubernetes.io/part-of: shop
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: command/production/test/shop-redis.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '16'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        managed-by: portainer-idp
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: app
          image: redis
          imagePullPolicy: Always
