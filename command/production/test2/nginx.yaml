apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: test2
  labels:
    app: nginx
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: command/production/test2/nginx.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-stack-id: '51'
    portainer-idp/edge-group-ids: '16'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        managed-by: portainer-idp
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: test2
  labels:
    app: nginx
    managed-by: portainer-idp
spec:
  selector:
    app: nginx
  type: NodePort
  ports:
    - name: port-80
      port: 80
      targetPort: 80
      protocol: TCP
