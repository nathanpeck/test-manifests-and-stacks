apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-2
  namespace: test2
  labels:
    app: nginx-2
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: command/production/test2/nginx-2.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '16'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-2
  template:
    metadata:
      labels:
        app: nginx-2
        managed-by: portainer-idp
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-2
  namespace: test2
  labels:
    app: nginx-2
    managed-by: portainer-idp
spec:
  selector:
    app: nginx-2
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-2
  namespace: test2
  labels:
    app: nginx-2
    managed-by: portainer-idp
spec:
  rules:
    - host: wordpress.nathanpeck.gg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-2
                port:
                  number: 80
