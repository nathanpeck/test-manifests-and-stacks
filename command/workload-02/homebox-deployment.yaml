apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: homebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homebox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homebox
    spec:
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:latest
          imagePullPolicy: Always
          env:
            - name: HBOX_AUTH_API_KEY_PEPPER
              value: "W1uCt4B5dqEnjqP+wqsctxyE1K9jyO0ipt1akSK5gNonjTb/XRf6X3RMgNNZVdsL"
          volumeMounts:
            - name: homebox
              mountPath: /data
      volumes:
        - name: homebox
          persistentVolumeClaim:
            claimName: homebox
