apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: homebox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homebox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homebox
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: homebox-auth
                  key: HBOX_AUTH_API_KEY_PEPPER
          ports:
            - name: http
              containerPort: 7745
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: homebox
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: homebox
          persistentVolumeClaim:
            claimName: homebox
        - name: tmp
          emptyDir: {}
