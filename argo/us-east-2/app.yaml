apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-config
  namespace: poc-argo
data:
  message: hello from argo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-app
  namespace: poc-argo
  labels:
    app: argo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argo-app
  template:
    metadata:
      labels:
        app: argo-app
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
