apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
        - name: redis-cache
          image: redis:7.4-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: storefront
spec:
  type: ClusterIP
  selector:
    app: redis-cache
  ports:
    - port: 6379
      targetPort: 6379
