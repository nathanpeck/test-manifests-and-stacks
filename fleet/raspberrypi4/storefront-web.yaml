apiVersion: v1
kind: Namespace
metadata:
  name: storefront
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-web
  namespace: storefront
  annotations:
    command.portainer.io/poc: existing-stack-sources
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront-web
  template:
    metadata:
      labels:
        app: storefront-web
    spec:
      containers:
        - name: storefront-web
          image: nginxinc/nginx-unprivileged:1.27.3-alpine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-web
  namespace: storefront
spec:
  type: ClusterIP
  selector:
    app: storefront-web
  ports:
    - port: 80
      targetPort: 8080
