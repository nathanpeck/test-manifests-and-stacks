apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r15-new-web
  namespace: uitest-r15-new-ns-xfq
  labels:
    app: uitest-r15-new-web
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r15-new-tgt-xfq/uitest-r15-new-ns-xfq/uitest-r15-new-web.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '55'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r15-new-web
  template:
    metadata:
      labels:
        app: uitest-r15-new-web
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r15-new-web
  namespace: uitest-r15-new-ns-xfq
  labels:
    app: uitest-r15-new-web
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r15-new-web
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
