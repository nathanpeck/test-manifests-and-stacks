apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r14-scale-a01
  namespace: uitest-r14-scale-eho
  labels:
    app: uitest-r14-scale-a01
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r14-scale-tgt/uitest-r14-scale-eho/uitest-r14-scale-a01.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '52'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r14-scale-a01
  template:
    metadata:
      labels:
        app: uitest-r14-scale-a01
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
