# Adopted by Portainer-Command exactly as it ran in the cluster, before Command managed it.
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app: web
    name: web
    namespace: pr290-adopt
spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
        matchLabels:
            app: web
    strategy:
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
        type: RollingUpdate
    template:
        metadata:
            creationTimestamp: null
            labels:
                app: web
        spec:
            containers:
                - image: nginx:1.27-alpine
                  imagePullPolicy: IfNotPresent
                  name: nginx
                  ports:
                    - containerPort: 80
                      protocol: TCP
                  resources: {}
                  terminationMessagePath: /dev/termination-log
                  terminationMessagePolicy: File
            dnsPolicy: ClusterFirst
            restartPolicy: Always
            schedulerName: default-scheduler
            securityContext: {}
            terminationGracePeriodSeconds: 30
