# Adopted by Portainer-Command exactly as it ran in the cluster, before Command managed it.
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app: api
    name: api
    namespace: pr290-adopt
spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
        matchLabels:
            app: api
    strategy:
        rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
        type: RollingUpdate
    template:
        metadata:
            creationTimestamp: null
            labels:
                app: api
        spec:
            containers:
                - args:
                    - -text=hello from api
                  image: hashicorp/http-echo:1.0
                  imagePullPolicy: IfNotPresent
                  name: echo
                  ports:
                    - containerPort: 5678
                      protocol: TCP
                  resources: {}
                  terminationMessagePath: /dev/termination-log
                  terminationMessagePolicy: File
            dnsPolicy: ClusterFirst
            restartPolicy: Always
            schedulerName: default-scheduler
            securityContext: {}
            terminationGracePeriodSeconds: 30
