apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-web
  namespace: wft-single
spec:
  replicas: 1
  selector:
    matchLabels: {app: single-web}
  template:
    metadata:
      labels: {app: single-web}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        env:
        - {name: GREETING, value: "v2"}
