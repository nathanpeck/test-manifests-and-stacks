apiVersion: apps/v1
kind: Deployment
metadata:
  name: dir-api
  namespace: wft-dir
spec:
  replicas: 1
  selector:
    matchLabels: {app: dir-api}
  template:
    metadata:
      labels: {app: dir-api}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        env:
        - {name: GREETING, value: "v1"}
