apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cozy-data
  namespace: default
  labels:
    app: cozy
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: a026815a-2579-4a06-878e-355046efb82c
    portainer-run/git-branch: main
    portainer-run/git-path: portainer-run/eu-central-1/default/cozy.yaml
    portainer-run/runtime: nginx
    portainer-run/vibe-source-path: portainer-run/eu-central-1/default/cozy/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozy
  namespace: default
  labels:
    app: cozy
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: a026815a-2579-4a06-878e-355046efb82c
    portainer-run/git-branch: main
    portainer-run/git-path: portainer-run/eu-central-1/default/cozy.yaml
    portainer-run/runtime: nginx
    portainer-run/vibe-source-path: portainer-run/eu-central-1/default/cozy/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cozy
  template:
    metadata:
      labels:
        app: cozy
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-web-guard
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - >-
              cp -a /etc/nginx/conf.d/. /guard/ && printf '%s' 'location ~ /\.(?!well-known/) { deny all; }

              ' > /guard/run-deny-dotfiles.inc && sed -i '/^server {/a include /etc/nginx/conf.d/run-deny-dotfiles.inc;'
              /guard/default.conf && grep -q run-deny-dotfiles.inc /guard/default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /guard
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: Always
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/nathanpeck/test-manifests-and-stacks /tmp/repo && rm -rf
              /tmp/repo/.git && rm -rf /usr/share/nginx/html/.git /usr/share/nginx/html/.env && mkdir -p
              /usr/share/nginx/html && cp -r /tmp/repo/portainer-run/eu-central-1/default/cozy/src/.
              /usr/share/nginx/html/ && rm -rf /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cozy-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cozy-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        - name: vibe-env
          image: busybox:1.36
          command:
            - sh
            - '-c'
            - rm -f /usr/share/nginx/html/.env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: cozy
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: cozy-app-secrets
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: cozy-data
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cozy
  namespace: default
  labels:
    app: cozy
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: a026815a-2579-4a06-878e-355046efb82c
    portainer-run/git-branch: main
    portainer-run/git-path: portainer-run/eu-central-1/default/cozy.yaml
    portainer-run/runtime: nginx
    portainer-run/vibe-source-path: portainer-run/eu-central-1/default/cozy/src
spec:
  type: ClusterIP
  selector:
    app: cozy
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cozy
  namespace: default
  labels:
    app: cozy
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: a026815a-2579-4a06-878e-355046efb82c
    portainer-run/git-branch: main
    portainer-run/git-path: portainer-run/eu-central-1/default/cozy.yaml
    portainer-run/runtime: nginx
    portainer-run/vibe-source-path: portainer-run/eu-central-1/default/cozy/src
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: cozy.nathanpeck.gg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cozy
                port:
                  number: 8080
