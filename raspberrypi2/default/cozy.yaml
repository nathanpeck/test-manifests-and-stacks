apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cozy-data
  namespace: default
  labels:
    app: cozy
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: badbcd1e-71b9-4b33-9051-1be2fc189772
    portainer-run/git-branch: main
    portainer-run/git-path: raspberrypi2/default/cozy.yaml
    portainer-run/vibe-source-path: raspberrypi2/default/cozy/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozy
  namespace: default
  labels:
    app: cozy
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: badbcd1e-71b9-4b33-9051-1be2fc189772
    portainer-run/git-branch: main
    portainer-run/git-path: raspberrypi2/default/cozy.yaml
    portainer-run/vibe-source-path: raspberrypi2/default/cozy/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cozy
  template:
    metadata:
      labels:
        app: cozy
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/nathanpeck/test-manifests-and-stacks /tmp/repo && mkdir -p
              /usr/share/nginx/html && cp -r /tmp/repo/raspberrypi2/default/cozy/src/. /usr/share/nginx/html/ && rm -rf
              /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cozy-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cozy-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: cozy
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: cozy-data
---
apiVersion: v1
kind: Service
metadata:
  name: cozy
  namespace: default
  labels:
    app: cozy
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: badbcd1e-71b9-4b33-9051-1be2fc189772
    portainer-run/git-branch: main
    portainer-run/git-path: raspberrypi2/default/cozy.yaml
    portainer-run/vibe-source-path: raspberrypi2/default/cozy/src
spec:
  type: NodePort
  selector:
    app: cozy
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
