apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r15-core-cat
  namespace: uitest-r15-core-std-qmv
  labels:
    app: uitest-r15-core-cat
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r15-core-tgt/uitest-r15-core-std-qmv/uitest-r15-core-cat.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '54'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r15-core-cat
  template:
    metadata:
      labels:
        app: uitest-r15-core-cat
        managed-by: portainer-idp
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r15-core-cat
  namespace: uitest-r15-core-std-qmv
  labels:
    app: uitest-r15-core-cat
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r15-core-cat
  type: NodePort
  ports:
    - name: port-80
      port: 80
      targetPort: 80
      protocol: TCP
