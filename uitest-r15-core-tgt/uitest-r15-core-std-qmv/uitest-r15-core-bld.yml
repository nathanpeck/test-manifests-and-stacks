apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r15-core-bld
  namespace: uitest-r15-core-std-qmv
  labels:
    app: uitest-r15-core-bld
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r15-core-tgt/uitest-r15-core-std-qmv/uitest-r15-core-bld.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '54'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r15-core-bld
  template:
    metadata:
      labels:
        app: uitest-r15-core-bld
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r15-core-bld
  namespace: uitest-r15-core-std-qmv
  labels:
    app: uitest-r15-core-bld
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r15-core-bld
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
