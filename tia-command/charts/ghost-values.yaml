ghostUsername: admin
ghostPassword: "Ch@ngeMe2024!"
ghostEmail: admin@example.com
ghostBlogTitle: "My Ghost Blog"

# Use NodePort so it's reachable without a LoadBalancer
service:
  type: NodePort
  nodePorts:
    http: "30080"

# Use local-path storage class available on this cluster
persistence:
  size: 2Gi
  storageClass: local-path

# Keep resource usage reasonable
resourcesPreset: "micro"

# Disable bundled MySQL — use external MariaDB instead
mysql:
  enabled: false

# Point Ghost at the MariaDB service deployed alongside it
externalDatabase:
  host: ghost-mariadb
  port: 3306
  user: ghost
  password: "ghostdbpass"
  database: ghost

# Ghost needs to know its URL to generate correct links
# The chart gates the entire Deployment on this being non-empty.
# Using the node IP with the NodePort since no external LB is assigned yet.
ghostHost: "10.10.109.168"
ghostPath: /

# Disable ingress (using Envoy Gateway HTTPRoute instead)
ingress:
  enabled: false
