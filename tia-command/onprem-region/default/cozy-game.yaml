apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cozy-game-data
  namespace: default
  labels:
    app: cozy-game
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozy-game
  namespace: default
  labels:
    app: cozy-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cozy-game
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: cozy-game
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: vibe-sync
        image: alpine/git:latest
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - >-
          git config --global http.sslVerify false &&
          git clone --depth 1 --branch main
          https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/nathanpeck/test-manifests-and-stacks
          /tmp/repo &&
          mkdir -p /usr/share/nginx/html &&
          cp -r /tmp/repo/kubernetes-local/default/cozy-game/src/. /usr/share/nginx/html/ &&
          rm -rf /tmp/repo
        env:
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: cozy-game-git-credentials
              key: username
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: cozy-game-git-credentials
              key: token
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: app-data
          mountPath: /usr/share/nginx/html
      containers:
      - name: cozy-game
        image: nginxinc/nginx-unprivileged:alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - "nginx -g 'daemon off;'"
        workingDir: /usr/share/nginx/html
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: app-data
          mountPath: /usr/share/nginx/html
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: cozy-game-data
---
apiVersion: v1
kind: Service
metadata:
  name: cozy-game
  namespace: default
  labels:
    app: cozy-game
spec:
  type: NodePort
  selector:
    app: cozy-game
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
    nodePort: 30255
