---
apiVersion: v1
kind: Secret
metadata:
  name: ghost-mariadb
  namespace: default
type: Opaque
stringData:
  mariadb-root-password: "rootpassword"
  mariadb-password: "ghostdbpass"
---
apiVersion: v1
kind: Service
metadata:
  name: ghost-mariadb
  namespace: default
  labels:
    app: ghost-mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: ghost-mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghost-mariadb
  namespace: default
  labels:
    app: ghost-mariadb
spec:
  serviceName: ghost-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: ghost-mariadb
  template:
    metadata:
      labels:
        app: ghost-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghost-mariadb
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: ghost
            - name: MARIADB_USER
              value: ghost
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghost-mariadb
                  key: mariadb-password
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command:
                - mariadb-admin
                - ping
                - -uroot
                - -p$(MARIADB_ROOT_PASSWORD)
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
