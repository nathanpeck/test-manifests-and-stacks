---
apiVersion: v1
kind: Secret
metadata:
  name: ghost-mariadb
  namespace: default
type: Opaque
stringData:
  mariadb-root-password: "rootpassword"
  mariadb-password: "ghostdbpass"
---
apiVersion: v1
kind: Service
metadata:
  name: ghost-mariadb
  namespace: default
  labels:
    app: ghost-mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: ghost-mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghost-mariadb
  namespace: default
  labels:
    app: ghost-mariadb
spec:
  serviceName: ghost-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: ghost-mariadb
  template:
    metadata:
      labels:
        app: ghost-mariadb
      annotations:
        rollout-trigger: "fix-run-mysqld-volume"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghost-mariadb
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: ghost
            - name: MARIADB_USER
              value: ghost
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghost-mariadb
                  key: mariadb-password
          ports:
            - containerPort: 3306
              name: mysql
          livenessProbe:
            exec:
              command:
                - mariadb-admin
                - ping
                - -ughost
                - -pghostdbpass
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mariadb-admin
                - ping
                - -ughost
                - -pghostdbpass
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: tmp
              mountPath: /tmp
            - name: run-mysqld
              mountPath: /run/mysqld
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run-mysqld
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
