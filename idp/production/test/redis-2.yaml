apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-2
  namespace: test
  labels:
    app: redis-2
    managed-by: portainer-idp
    app.kubernetes.io/part-of: nginx-and-redis
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: idp/production/test/redis-2.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '16'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-2
  template:
    metadata:
      labels:
        app: redis-2
        managed-by: portainer-idp
        app.kubernetes.io/part-of: nginx-and-redis
    spec:
      containers:
        - name: app
          image: reids
          imagePullPolicy: Always
          env:
            - name: REDIS
              value: nginx.test.svc.cluster.local:80
