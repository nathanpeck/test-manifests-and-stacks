apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-2
  namespace: test
  labels:
    app: nginx-2
    managed-by: portainer-idp
    app.kubernetes.io/part-of: nginx-and-redis
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: idp/production/test/nginx-2.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '16'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-2
  template:
    metadata:
      labels:
        app: nginx-2
        managed-by: portainer-idp
        app.kubernetes.io/part-of: nginx-and-redis
    spec:
      containers:
        - name: app
          image: nginx
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-2
  namespace: test
  labels:
    app: nginx-2
    managed-by: portainer-idp
    app.kubernetes.io/part-of: nginx-and-redis
spec:
  selector:
    app: nginx-2
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
