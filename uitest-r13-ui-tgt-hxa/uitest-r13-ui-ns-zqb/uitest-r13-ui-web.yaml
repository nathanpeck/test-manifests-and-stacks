apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r13-ui-web
  namespace: uitest-r13-ui-ns-zqb
  labels:
    app: uitest-r13-ui-web
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r13-ui-tgt-hxa/uitest-r13-ui-ns-zqb/uitest-r13-ui-web.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '47'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r13-ui-web
  template:
    metadata:
      labels:
        app: uitest-r13-ui-web
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r13-ui-web
  namespace: uitest-r13-ui-ns-zqb
  labels:
    app: uitest-r13-ui-web
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r13-ui-web
  type: ClusterIP
  ports:
    - name: port-80
      port: 80
      targetPort: 80
      protocol: TCP
