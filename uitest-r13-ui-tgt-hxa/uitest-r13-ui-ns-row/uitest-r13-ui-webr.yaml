apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r13-ui-webr
  namespace: uitest-r13-ui-ns-row
  labels:
    app: uitest-r13-ui-webr
    managed-by: portainer-idp
spec:
  replicas: 0
  selector:
    matchLabels:
      app: uitest-r13-ui-webr
  template:
    metadata:
      labels:
        app: uitest-r13-ui-webr
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r13-ui-web
  namespace: uitest-r13-ui-ns-row
  labels:
    app: uitest-r13-ui-webr
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r13-ui-webr
  type: ClusterIP
  ports:
    - name: port-80
      port: 80
      targetPort: 80
      protocol: TCP
