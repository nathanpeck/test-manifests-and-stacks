apiVersion: v1
kind: Namespace
metadata:
  name: poc-flux
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podinfo-config
  namespace: poc-flux
data:
  message: hello from flux base
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: poc-flux
  labels:
    app: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
