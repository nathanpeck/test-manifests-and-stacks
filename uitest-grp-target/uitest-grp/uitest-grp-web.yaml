apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-grp-web
  namespace: uitest-grp
  labels:
    app: uitest-grp-web
    managed-by: portainer-idp
    app.kubernetes.io/part-of: uitest-grp-shop
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-grp-target/uitest-grp/uitest-grp-web.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '25'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-grp-web
  template:
    metadata:
      labels:
        app: uitest-grp-web
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-grp-web
  namespace: uitest-grp
  labels:
    app: uitest-grp-web
    managed-by: portainer-idp
    app.kubernetes.io/part-of: uitest-grp-shop
spec:
  selector:
    app: uitest-grp-web
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
