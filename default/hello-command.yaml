apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-command
  namespace: default
  labels:
    app: hello-command
    managed-by: portainer-command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-command
  template:
    metadata:
      labels:
        app: hello-command
        managed-by: portainer-command
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hello-command
  namespace: default
  labels:
    app: hello-command
    managed-by: portainer-command
spec:
  selector:
    app: hello-command
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
