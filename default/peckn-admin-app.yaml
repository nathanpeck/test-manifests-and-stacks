apiVersion: apps/v1
kind: Deployment
metadata:
  name: peckn-admin-app
  namespace: default
  labels:
    app: peckn-admin-app
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: default/peckn-admin-app.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-stack-id: '9'
    portainer-idp/edge-group-ids: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: peckn-admin-app
  template:
    metadata:
      labels:
        app: peckn-admin-app
        managed-by: portainer-idp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
