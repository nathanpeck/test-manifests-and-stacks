apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-demo
  namespace: default
  labels:
    app: podinfo-demo
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: default/podinfo-demo.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '1'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo-demo
  template:
    metadata:
      labels:
        app: podinfo-demo
        managed-by: portainer-idp
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: PODINFO_UI_MESSAGE
              value: Deployed via Portainer IDP
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-demo
  namespace: default
  labels:
    app: podinfo-demo
    managed-by: portainer-idp
spec:
  selector:
    app: podinfo-demo
  type: NodePort
  ports:
    - name: port-9898
      port: 9898
      targetPort: 9898
      protocol: TCP
