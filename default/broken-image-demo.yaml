apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-demo
  namespace: default
  labels:
    app: broken-image-demo
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: default/broken-image-demo.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image-demo
  template:
    metadata:
      labels:
        app: broken-image-demo
        managed-by: portainer-idp
    spec:
      containers:
        - name: broken
          image: ghcr.io/nathanpeck/this-image-does-not-exist:v0.0.1
          imagePullPolicy: Always
