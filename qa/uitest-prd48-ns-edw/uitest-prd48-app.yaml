apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-prd48-app
  namespace: uitest-prd48-ns-edw
  annotations:
    portainer-idp/git-target-id: "1"
    portainer-idp/git-branch: main
    portainer-idp/git-path: qa/uitest-prd48-ns-edw/uitest-prd48-app.yaml
    portainer-idp/edge-stack: "true"
    portainer-idp/edge-group-ids: "27"
  labels:
    app: uitest-prd48-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-prd48-app
  template:
    metadata:
      labels:
        app: uitest-prd48-app
    spec:
      containers:
        - name: web
          # PRD-48 decoy: released by the release API in this test
          image: nginx:1.27.2-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
