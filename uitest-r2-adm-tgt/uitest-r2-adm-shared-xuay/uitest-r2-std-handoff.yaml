apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r2-std-handoff
  namespace: uitest-r2-adm-shared-xuay
  labels:
    app: uitest-r2-std-handoff
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: uitest-r2-adm-tgt/uitest-r2-adm-shared-xuay/uitest-r2-std-handoff.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-stack-id: '33'
    portainer-idp/edge-group-ids: '10'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r2-std-handoff
  template:
    metadata:
      labels:
        app: uitest-r2-std-handoff
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: traefik/whoami:v1.10
          imagePullPolicy: IfNotPresent
          env:
            - name: HANDOFF_REV
              value: '1'
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r2-std-handoff
  namespace: uitest-r2-adm-shared-xuay
  labels:
    app: uitest-r2-std-handoff
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r2-std-handoff
  type: ClusterIP
  ports:
    - name: port-80
      port: 80
      targetPort: 80
      protocol: TCP
