apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r11-out-web
  namespace: dev-namespace
  labels:
    app: uitest-r11-out-web
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/uitest-r11-out-web.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r11-out-web
  template:
    metadata:
      labels:
        app: uitest-r11-out-web
        managed-by: portainer-idp
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: Always
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: uitest-r11-out-sec-vhl
                  key: API_TOKEN
