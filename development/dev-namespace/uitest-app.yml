apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-app
  namespace: dev-namespace
  labels:
    app: uitest-app
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/uitest-app.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uitest-app
  template:
    metadata:
      labels:
        app: uitest-app
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - echo PLAINTEXT_API_TOKEN=$API_TOKEN; while true; do sleep 30; done
          envFrom:
            - secretRef:
                name: uitest-secret
