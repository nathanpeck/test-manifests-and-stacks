apiVersion: apps/v1
kind: Deployment
metadata:
  name: t384-cat-mail
  namespace: dev-namespace
  labels:
    app: t384-cat-mail
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/t384-cat-mail.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t384-cat-mail
  template:
    metadata:
      labels:
        app: t384-cat-mail
        managed-by: portainer-idp
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1
          ports:
            - containerPort: 1025
            - containerPort: 8025
          env:
            - name: MP_MAX_MESSAGES
              value: '1000'
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: 8025
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8025
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: t384-cat-mail
  namespace: dev-namespace
  labels:
    app: t384-cat-mail
    managed-by: portainer-idp
spec:
  selector:
    app: t384-cat-mail
  type: ClusterIP
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
      protocol: TCP
    - name: http
      port: 8025
      targetPort: 8025
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: t384-cat-mail-svc-1
  namespace: dev-namespace
  labels:
    app: t384-cat-mail
    managed-by: portainer-idp
spec:
  selector:
    app: t384-cat-mail
  type: NodePort
  ports:
    - name: http
      port: 8025
      targetPort: 8025
      protocol: TCP
