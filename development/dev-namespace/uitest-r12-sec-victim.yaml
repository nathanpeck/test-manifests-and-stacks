apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r12-sec-victim
  namespace: dev-namespace
  labels:
    app: uitest-r12-sec-victim
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: 'main'
    portainer-idp/git-path: 'development/dev-namespace/uitest-r12-sec-victim.yaml'
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r12-sec-lbl
  template:
    metadata:
      labels:
        app: uitest-r12-sec-lbl
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          command: ["sh", "-c", "echo VICTIM-LOG-LINE note=$DECOY_NOTE; exec nginx -g 'daemon off;'"]
          env:
            - name: DECOY_NOTE
              value: r12-victim-literal-env-visible
