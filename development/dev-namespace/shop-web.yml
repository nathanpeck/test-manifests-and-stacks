apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dev-namespace
  labels:
    app: web
    managed-by: portainer-idp
    app.kubernetes.io/part-of: shop
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/shop-web.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        managed-by: portainer-idp
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: app
          image: nginx
          imagePullPolicy: Always
