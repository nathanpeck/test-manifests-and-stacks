apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r5-web
  namespace: dev-namespace
  labels:
    app: uitest-r5-web
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/uitest-r5-web.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uitest-r5-web
  template:
    metadata:
      labels:
        app: uitest-r5-web
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
