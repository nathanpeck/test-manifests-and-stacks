apiVersion: apps/v1
kind: Deployment
metadata:
  name: t384-cat-nginx
  namespace: dev-namespace
  labels:
    app: t384-cat-nginx
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/t384-cat-nginx.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t384-cat-nginx
  template:
    metadata:
      labels:
        app: t384-cat-nginx
        managed-by: portainer-idp
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: t384-cat-nginx
  namespace: dev-namespace
  labels:
    app: t384-cat-nginx
    managed-by: portainer-idp
spec:
  selector:
    app: t384-cat-nginx
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t384-cat-nginx
  namespace: dev-namespace
  labels:
    app: t384-cat-nginx
    managed-by: portainer-idp
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: t384-cat-nginx.nathanpeck.gg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: t384-cat-nginx
                port:
                  number: 80
