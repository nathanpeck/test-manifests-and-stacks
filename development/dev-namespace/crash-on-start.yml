apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-on-start
  namespace: dev-namespace
  labels:
    app: crash-on-start
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/crash-on-start.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-on-start
  template:
    metadata:
      labels:
        app: crash-on-start
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - echo crashing on start; exit 1
