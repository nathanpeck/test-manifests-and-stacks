apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginc
  namespace: dev-namespace
  labels:
    app: nginc
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/nginc.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginc
  template:
    metadata:
      labels:
        app: nginc
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx
          imagePullPolicy: Always
