apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r12-sec-lbl
  namespace: dev-namespace
  labels:
    app: uitest-r12-sec-lbl
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/dev-namespace/uitest-r12-sec-lbl.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r12-sec-lbl
  template:
    metadata:
      labels:
        app: uitest-r12-sec-lbl
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          command: ["sh", "-c", "echo OUT-LOG-LINE decoyref=$DECOY_REF; exec nginx -g 'daemon off;'"]
          env:
            - name: DECOY_REF
              valueFrom:
                secretKeyRef:
                  name: uitest-r12-sec-sec
                  key: token
                  optional: true
