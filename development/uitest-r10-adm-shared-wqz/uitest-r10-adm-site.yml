apiVersion: v1
kind: ConfigMap
metadata:
  name: uitest-r10-adm-site-nginx
  namespace: uitest-r10-adm-shared-wqz
  labels:
    app: uitest-r10-adm-site
    managed-by: portainer-idp
data:
  default.conf: |
    server {
      listen 80;
      # git-sync swaps this link to each new checkout atomically.
      root /git/current;
      index index.html;
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r10-adm-site
  namespace: uitest-r10-adm-shared-wqz
  labels:
    app: uitest-r10-adm-site
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/uitest-r10-adm-shared-wqz/uitest-r10-adm-site.yml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r10-adm-site
  template:
    metadata:
      labels:
        app: uitest-r10-adm-site
        managed-by: portainer-idp
    spec:
      initContainers:
        - name: clone
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --one-time
          env:
            - name: GITSYNC_REPO
              value: https://github.com/stefanprodan/podinfo
            - name: GITSYNC_REF
              value: HEAD
            - name: GITSYNC_ROOT
              value: /git
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_DEPTH
              value: '1'
            - name: GITSYNC_PERIOD
              value: 60s
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: static-site-git
                  key: username
                  optional: true
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: static-site-git
                  key: token
                  optional: true
          volumeMounts:
            - name: site
              mountPath: /git
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: nginx
          image: nginx:1-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /git
              readOnly: true
            - name: cm-static-site-nginx
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
        - name: sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          env:
            - name: GITSYNC_REPO
              value: https://github.com/stefanprodan/podinfo
            - name: GITSYNC_REF
              value: HEAD
            - name: GITSYNC_ROOT
              value: /git
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_DEPTH
              value: '1'
            - name: GITSYNC_PERIOD
              value: 60s
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: static-site-git
                  key: username
                  optional: true
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: static-site-git
                  key: token
                  optional: true
          volumeMounts:
            - name: site
              mountPath: /git
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: site
          emptyDir: {}
        - name: cm-static-site-nginx
          configMap:
            name: uitest-r10-adm-site-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: uitest-r10-adm-site
  namespace: uitest-r10-adm-shared-wqz
  labels:
    app: uitest-r10-adm-site
    managed-by: portainer-idp
spec:
  selector:
    app: uitest-r10-adm-site
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
