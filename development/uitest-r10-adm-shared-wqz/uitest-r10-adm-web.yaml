apiVersion: apps/v1
kind: Deployment
metadata:
  name: uitest-r10-adm-web
  namespace: uitest-r10-adm-shared-wqz
  labels:
    app: uitest-r10-adm-web
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: development/uitest-r10-adm-shared-wqz/uitest-r10-adm-web.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '26'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uitest-r10-adm-web
  template:
    metadata:
      labels:
        app: uitest-r10-adm-web
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: Always
